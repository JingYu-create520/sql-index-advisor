name: "SQL Index Advisor"
description: "Offline MySQL/MyBatis index review on every PR: mapper XML or slow log in, line-level annotations out."
author: "JingYu-create520"

branding:
  icon: "database"
  color: "blue"

inputs:
  path:
    description: "Mapper XML file or directory, slow query log, or .sql file"
    required: false
    default: "src/main/resources"
  schema:
    description: "Optional schema.json path (see examples/schema-dump.sql). Unlocks SIA002/003/005/007."
    required: false
    default: ""
  min-severity:
    description: "info | warn | error"
    required: false
    default: "info"
  fail-on:
    description: "off | info | warn | error — 'off' reports annotations without failing the job"
    required: false
    default: "off"
  mysql-version:
    description: "5.7 or 8.0"
    required: false
    default: "8.0"
  top:
    description: "Maximum findings to annotate"
    required: false
    default: "50"
  args:
    description: "Extra CLI arguments, e.g. '--rules SIA001,SIA004'"
    required: false
    default: ""
  cli:
    description: "Command to run the CLI with. Empty uses the bundle shipped in this repository, so no install step is needed."
    required: false
    default: ""

outputs:
  report-file:
    description: "Path to the JSON report artifact written into the workspace"
    value: ${{ steps.report.outputs.report-file }}
  cli:
    description: "The command that runs the CLI in this job, for a later step that wants a second look at the same input"
    value: ${{ steps.cli.outputs.bin }}

runs:
  using: "composite"
  steps:
    - name: "Resolve the CLI"
      id: "cli"
      # Running the committed dist/cli.js is the default on purpose. The earlier
      # design installed the package globally with `npm i -g github:…` and then
      # called `sia`; on a GitHub runner that install produced nothing on PATH
      # ("sia: command not found", exit 127) while the step that consumed it kept
      # `continue-on-error`, so the check still reported green. No install, no
      # PATH, no npm tar-extraction surprises: the action ships its own bundle.
      shell: bash
      env:
        OVERRIDE: ${{ inputs.cli }}
      run: |
        set -euo pipefail
        if [ -n "${OVERRIDE}" ]; then
          echo "bin=${OVERRIDE}" >> "$GITHUB_OUTPUT"
          echo "Using the CLI supplied by the caller."
        else
          entry="${GITHUB_ACTION_PATH}/dist/cli.js"
          if [ ! -f "${entry}" ]; then
            echo "::error::${entry} is missing. Pin a tag from 0.1.6 or later, or pass the cli input."
            exit 1
          fi
          echo "bin=node ${entry}" >> "$GITHUB_OUTPUT"
          node "${entry}" --version
        fi

    - name: "Collect input (guards against injecting user text into the shell)"
      id: "config"
      shell: bash
      env:
        SCHEMA: ${{ inputs.schema }}
      run: |
        schema_flag=""
        if [ -n "${SCHEMA}" ]; then schema_flag="--schema ${SCHEMA}"; fi
        echo "schema-flag=${schema_flag}" >> "$GITHUB_OUTPUT"

    - name: "Annotate findings"
      id: "report"
      shell: bash
      env:
        CLI: ${{ steps.cli.outputs.bin }}
        PATH_ARG: ${{ inputs.path }}
        SCHEMA_FLAG: ${{ steps.config.outputs.schema-flag }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        TOP: ${{ inputs.top }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set +e
        # Findings must not break a build here: the job below decides that. A
        # non-zero exit larger than 1 means the tool itself never ran, and that is
        # a broken review, not a clean bill of health, so it has to be loud.
        ${CLI} "${PATH_ARG}" ${SCHEMA_FLAG} \
          --format github \
          --min-severity "${MIN_SEVERITY}" \
          --mysql-version "${MYSQL_VERSION}" \
          --top "${TOP}" \
          ${EXTRA_ARGS} | tee sia-annotations.txt
        code=${PIPESTATUS[0]}
        if [ "${code}" -gt 1 ]; then
          echo "::error::sql-index-advisor failed to run (exit ${code}). Check the path and schema inputs; the annotations below, if any, are incomplete."
          exit 1
        fi
        set -e

        ${CLI} "${PATH_ARG}" ${SCHEMA_FLAG} \
          --format json \
          --min-severity "${MIN_SEVERITY}" \
          --mysql-version "${MYSQL_VERSION}" \
          --top "${TOP}" \
          ${EXTRA_ARGS} > sia-report.json
        echo "report-file=sia-report.json" >> "$GITHUB_OUTPUT"

        {
          echo "## SQL Index Advisor"
          echo
          echo '```'
          head -n 60 sia-annotations.txt | sed 's/^::\(error\|warning\|notice\) [^:]*::/• /'
          echo '```'
          echo
          echo "_离线规则引擎产出，建议需人工评审后再执行。加 \`schema\` 入参可解锁依赖现有索引的规则。_"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: "Fail the job (only when fail-on is set)"
      if: ${{ inputs.fail-on != 'off' }}
      env:
        CLI: ${{ steps.cli.outputs.bin }}
        PATH_ARG: ${{ inputs.path }}
        SCHEMA_FLAG: ${{ steps.config.outputs.schema-flag }}
        FAIL_ON: ${{ inputs.fail-on }}
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        EXTRA_ARGS: ${{ inputs.args }}
      shell: bash
      run: |
        # Actions runs `run:` blocks under `bash -e`, so a non-zero exit would
        # abort this step before the reason is printed. Exit 1 means "there are
        # findings at or above --fail-on"; exit 2 means the tool itself failed.
        # Those two must not read the same in a build log.
        set +e
        ${CLI} "${PATH_ARG}" ${SCHEMA_FLAG} \
          --format json \
          --fail-on "${FAIL_ON}" \
          --mysql-version "${MYSQL_VERSION}" \
          ${EXTRA_ARGS} > /dev/null
        code=$?
        set -e
        if [ "$code" = "1" ]; then
          echo "::error::sql-index-advisor found issues at or above '${FAIL_ON}'. See the step summary."
          exit 1
        fi
        if [ "$code" != "0" ]; then
          echo "::error::sql-index-advisor exited with $code: the tool failed to run (bad path, unreadable input). The gate itself never evaluated anything."
          exit 1
        fi
        exit 0
