# Example: run sql-index-advisor on every pull request that touches a Mapper XML.
#
# Copy this into YOUR repository at .github/workflows/sql-index-advisor.yml
# (it is only an example inside this repo, so it does not run here).

name: SQL Index Advisor

on:
  pull_request:
    paths:
      - "**/mapper/**/*.xml"
      - "src/main/resources/**/*.xml"

permissions:
  contents: read
  pull-requests: comment

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Line-level comments: scan the mapper directory and emit the result as
      # ::warning file=...,line=... annotations.
      # fail-on: off => advisory only, does not redden the build; change to error for a gate.
      # The Action runs the bundle it ships, so nothing has to be installed first.
      - name: Index review
        id: index-review
        uses: JingYu-create520/sql-index-advisor@v0
        with:
          path: src/main/resources/mapper
          min-severity: warn
          mysql-version: "8.0"
          fail-on: "off"

      # Optional: keep the full JSON report as an artifact for an agent or a human to re-check.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sia-report
          path: sia-report.json
          if-no-files-found: ignore

      # Optional: hand the DBA a reviewable migration file, using the same CLI the
      # Action ran (its `cli` output), so this step cannot drift to another version.
      - name: Emit migration SQL
        run: |
          ${{ steps.index-review.outputs.cli }} src/main/resources/mapper \
            --emit-sql sia-migrations.sql --format json > /dev/null || true
          cat sia-migrations.sql || true
